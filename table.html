<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Assassin's Class Table</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 40px;
      background: url('background2.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #f2f2f2;
    }

    h1, h2 {
      color: #e50914;
      text-shadow: 1px 1px 5px black;
    }

    form {
      margin-bottom: 30px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #e50914;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(229, 9, 20, 0.3);
      width: 350px;
    }

    input, textarea, button {
      display: block;
      margin: 10px 0;
      padding: 10px;
      width: 100%;
      background: #222;
      color: white;
      border: 1px solid #444;
      border-radius: 5px;
      transition: 0.3s;
    }

    input:focus, textarea:focus {
      border-color: #e50914;
      background: #1a1a1a;
      outline: none;
    }

    button {
      background: #e50914;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ff1f1f;
      transform: scale(1.03);
    }

    table {
      width: 90%;
      border-collapse: collapse;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.2);
    }

    th, td {
      border: 1px solid #333;
      padding: 12px;
      text-align: left;
    }

    th {
      background: #e50914;
      color: white;
    }

    tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }

    #charCount {
      font-size: 12px;
      color: #aaa;
      margin-top: -8px;
      margin-bottom: 8px;
    }

    #className {
      width: 250px;
    }

    #numberOfPeople {
      width: 250px;
    }

    #description {
      width: 300px;
      height: 80px;
    }
  </style>
</head>
<body>
  <h1>Welcome, Assassin Admin!</h1>
  <p>You have been redirected to the class management table.</p>

  <h2>Class Information Input Form</h2>
  <p style="font-size: 14px; color: #ccc; margin-bottom: 10px;">
    Double-click a row to delete it.
  </p>

  <!-- Form to add new class -->
  <form id="classForm">
    <input type="text" id="className" placeholder="Class Name" required />
    <div id="charCount"></div>
    <input type="number" id="numberOfPeople" placeholder="Number of People" required />
    <textarea id="description" placeholder="Description" rows="4" required></textarea>
    <button type="submit">Add Class</button>
  </form>

  <!-- Table for displaying class entries -->
  <h2>Class Table</h2>
  <table id="classTable">
    <thead>
      <tr>
        <th>Class Name</th>
        <th>Number of People</th>
        <th>Description</th>
        <th>Action</th> <!-- Edit button will be placed here -->
      </tr>
    </thead>
    <tbody>
      <!-- Dynamic rows will be inserted here -->
    </tbody>
  </table>

  <!-- Container where assassin character images will be displayed -->
  <div id="assassinDisplay" style="position: fixed; left: 60%; top: 100px;"></div>

  <script>
    // Array of character image file names
    const assassinImages = [
      "char1.png",
      "char2.png",
      "char3.png",
      "char4.png",
      "char5.png"
    ];

    // Counter for how many characters have been added
    let addedCount = 0;

    const form = document.getElementById("classForm");
    const tableBody = document.getElementById("classTable").querySelector("tbody");

    // Form submission event
    form.addEventListener("submit", function (event) {
      event.preventDefault();

      // Get input values
      const className = document.getElementById("className").value;
      const numberOfPeople = document.getElementById("numberOfPeople").value;
      const description = document.getElementById("description").value;

      // Create a new row in the table
      const newRow = document.createElement("tr");

      newRow.innerHTML = `
        <td class="class-name-cell">${className}</td>
        <td>${numberOfPeople}</td>
        <td>${description}</td>
        <td><button class="edit-btn">Edit</button></td>
      `;

      // Double-click to delete the row  Event 1
      newRow.addEventListener("dblclick", function () {
        tableBody.removeChild(newRow);
      });

      // Hover effect to change text color   Event 2
      newRow.addEventListener("mouseover", function () {
        newRow.style.color = "#e50914";
      });

      newRow.addEventListener("mouseout", function () {
        newRow.style.color = "#f2f2f2";
      });

      // Append new row to table
      tableBody.appendChild(newRow);

      // Play sound when new row is added
      document.getElementById("addSound").play();

      // Add new character image
      const container = document.getElementById("assassinDisplay");
      const img = document.createElement("img");
      img.src = assassinImages[addedCount % assassinImages.length];
      img.style.position = "absolute";
      img.style.width = "60px";
      img.style.transition = "all 0.5s ease-in-out";

      // Grid positioning: 6 characters per row
      const row = Math.floor(addedCount / 6);
      const col = addedCount % 6;
      img.style.left = `${col * 65}px`;
      img.style.top = `${row * 100}px`;

      container.appendChild(img);
      addedCount++;

      // Edit functionality
      const editButton = newRow.querySelector(".edit-btn");
      const classNameCell = newRow.querySelector(".class-name-cell");
      const numberCell = newRow.children[1];
      const descCell = newRow.children[2];

      editButton.addEventListener("click", function () {
        // Edit Class Name
        const classInput = document.createElement("input");
        classInput.type = "text";
        classInput.value = classNameCell.textContent;
        classInput.style.width = "90%";
        classNameCell.textContent = "";
        classNameCell.appendChild(classInput);
        classInput.focus();
        classInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            classNameCell.textContent = classInput.value;
          }
        });

        // Edit Number of People
        const numberInput = document.createElement("input");
        numberInput.type = "number";
        numberInput.value = numberCell.textContent;
        numberInput.style.width = "90%";
        numberCell.textContent = "";
        numberCell.appendChild(numberInput);
        numberInput.addEventListener("input", function () {
          if (isNaN(numberInput.value) || numberInput.value.includes("e")) {
            numberInput.value = numberInput.value.replace(/[^0-9]/g, '');
          }
        });
        numberInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            numberCell.textContent = numberInput.value;
          }
        });

        // Edit Description
        const descInput = document.createElement("input");
        descInput.type = "text";
        descInput.value = descCell.textContent;
        descInput.style.width = "90%";
        descCell.textContent = "";
        descCell.appendChild(descInput);
        descInput.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            descCell.textContent = descInput.value;
          }
        });
      });

      // Clear form after submission
      form.reset();
      document.getElementById("charCount").textContent = "";
    });

    // Focus and blur border styling for inputs  Event 3
    const inputs = document.querySelectorAll("input, textarea");
    inputs.forEach((input) => {
      input.addEventListener("focus", function () {
        input.style.border = "2px solid #e50914";
      });

      input.addEventListener("blur", function () {
        input.style.border = "1px solid #444";
      });
    });

    // Character count logic for class name input   Event 4
    const classNameInput = document.getElementById("className");
    const charCountDiv = document.getElementById("charCount");
    const maxChars = 20;

    classNameInput.addEventListener("keyup", function () {
      const currentLength = classNameInput.value.length;
      const remaining = maxChars - currentLength;
      charCountDiv.textContent = `${remaining} characters remaining`;
    });
  </script>

  <!-- Audio element for sound effect when class is added -->
  <audio id="addSound" src="add.mp3" preload="auto"></audio>

</body>
</html>
