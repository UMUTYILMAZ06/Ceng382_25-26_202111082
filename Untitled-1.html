<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assassin's Creed Themed Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: url('background.jpg') no-repeat center center/cover;
            transition: background 0.5s;
        }
        .login-container {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
            text-align: center;
            color: white;
            transform: scale(0.8);
            animation: fadeIn 0.8s forwards;
            border: 2px solid rgba(255, 0, 0, 0.8);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            transition: all 0.3s ease-in-out;
        }
        input:focus {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }
        .blade {
            position: fixed;
            width: 10px;
            height: 100px;
            background: silver;
            border-radius: 5px;
            bottom: -45px;
            transform: scaleY(0);
            transition: transform 0.5s ease-out;
        }
        .blade-left {
            left: -0px;
            transform: rotate(38deg) scaleY(0);
        }
        .blade-right {
            left: calc(100% - 20px);
            transform: rotate(-45deg) scaleY(0);
        }
        .login-container:hover .blade {
            transform: scaleY(1.8);
        }
        .login-container:hover .blade-left {
            transform: rotate(38deg) scaleY(1.8);
        }
        .login-container:hover .blade-right {
            transform: rotate(-45deg) scaleY(1.8);
        }
        .shuriken {
            width: 40px;
            height: 40px;
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            border-radius: 50%;
            background: linear-gradient(45deg, rgb(231, 7, 7), rgb(211, 15, 15));
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: none;
            opacity: 0;
        }
        .shuriken-left {
            left: -40px;
        }
        .shuriken-right {
            left: 500px;
        }
        @keyframes shurikenThrow {
            0% {
                bottom: -50px;
                left: 50%;
                transform: translateX(-50%) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                bottom: -10px;
                transform: scale(1) rotate(360deg);
            }
        }
        .login-container:hover .shuriken {
            animation: shurikenThrow 0.5s ease-out forwards, spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

                /* Hançerlerin ortak stilleri */
        .dagger-container {
            position: absolute;
            top: 20px; /* Sayfanın üst kısmına */
            display: flex;
            align-items: center;
        }

        /* Sol hançer (Saat yönünde döner) */
        .dagger-left {
            left: 38%;
            transform: rotate(45deg);  
            animation: daggerSpinClockwise 3s linear infinite; 
        }

        /* Sağ hançer (Saat yönünün tersine döner) */
        .dagger-right {
            right: 40%;
            transform: rotate(-45deg); 
            animation: daggerSpinCounterClockwise 3s linear infinite; 
        }

        /* Hançerin bıçak kısmı */
        .dagger-blade {
            width: 10px;
            height: 60px;
            background: linear-gradient(180deg, silver, gray);
            clip-path: polygon(50% 0%, 70% 15%, 100% 100%, 0% 100%, 30% 15%);
            border-radius: 2px;
            position: relative;
        }

        /* Hançerin sapı */
        .dagger-handle {
            width: 20px; /* Sap genişliği */
            height: 18px; /* Sap uzunluğu */
            background: black;
            position: absolute;
            bottom: -18px; /* Sap bıçağın altına taşındı */
            left: 50%;
            transform: translateX(-50%);
            border-radius: 4px;
        }

        /* Saat yönünde döndürme animasyonu (Sol hançer için) */
        @keyframes daggerSpinClockwise {
            from { transform: rotate(45deg); }
            to { transform: rotate(405deg); } /* 360 + 45 */
        }

        /* Saat yönünün tersine döndürme animasyonu (Sağ hançer için) */
        @keyframes daggerSpinCounterClockwise {
            from { transform: rotate(-45deg); }
            to { transform: rotate(-405deg); } /* -360 - 45 */
        }
        
   /* Assassin's Creed Logosu için Ana Konteyner */
.ac-logo {
    position: absolute;
    top: -80px;  /* Login kutusunun biraz yukarısına */
    width: 100px;
    height: 120px;
    opacity: 0;  /* Başlangıçta görünmez */
    transition: opacity 0.5s ease-in-out;
}

/* Sol Logo */
.ac-logo-left {
    left: -100px; /* Login kutusunun soluna */
}

/* Sağ Logo */
.ac-logo-right {
    right: -100px; /* Login kutusunun sağına */
}

/* Üstteki A harfi şeklindeki üçgen */
.ac-logo-top {
    width: 0;
    height: 0;
    border-left: 50px solid transparent;
    border-right: 50px solid transparent;
    border-bottom: 100px solid black;
    position: absolute;
    top: 0;
    left: 0;
}

/* Alt kısımdaki kanatları oluşturan şekil */
.ac-logo-bottom {
    width: 100px;
    height: 50px;
    background: black;
    position: absolute;
    bottom: 0;
    left: 0;
    clip-path: polygon(0% 100%, 15% 35%, 50% 0%, 85% 35%, 100% 100%, 50% 70%);
}

/* Login kutusuna hover yapınca logolar görünür */
.login-container:hover .ac-logo {
    opacity: 1;
}




        button {
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        button:hover {
            background: rgba(255, 0, 0, 1);
            transform: scale(1.1);
        }
        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
 
    <div class="dagger-container dagger-left">
        <div class="dagger-handle"></div>
        <div class="dagger-blade"></div>
    </div>
    
    <div class="dagger-container dagger-right">
        <div class="dagger-handle"></div>
        <div class="dagger-blade"></div>
    </div>
    
    <div class="login-container" onmouseenter="playSound()">
        <!-- Sol Logo -->
    <div class="ac-logo ac-logo-left">
        <div class="ac-logo-top"></div>
        <div class="ac-logo-bottom"></div>
    </div>

    <!-- Sağ Logo -->
    <div class="ac-logo ac-logo-right">
        <div class="ac-logo-top"></div>
        <div class="ac-logo-bottom"></div>
    </div>
        <div class="shuriken shuriken-left"></div>
        <h2>Login</h2>
        <div class="shuriken shuriken-right"></div>
        <div class="blade blade-left"></div>
        <div class="blade blade-right"></div>
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button onclick="playVideo()">Login</button>
    </div>
    <div class="video-container" id="videoContainer">
        <video id="video" src="video.mp4" controls></video>
    </div>
    <audio id="bladeSound" src="blade.mp3"></audio>
    <script>
        function playVideo() {
            let videoContainer = document.getElementById("videoContainer");
            let video = document.getElementById("video");
            videoContainer.style.display = "block";
            video.play();
        }
        function playSound() {
            document.getElementById("bladeSound").play();
        }
    </script>
</body>
</html>
